name: fuzzingclient-memory

on:
  push:
    branches: [bot-ci-memory-experiments]
  workflow_dispatch:

env:
  PY27_PREFIX: /home/runner/.local/python2.7
  # Built from this checkout by `just docker-build`, or pulled from Docker Hub
  # for the published-image jobs.
  IMAGE: crossbario/autobahn-testsuite:25.10.1

jobs:
  fuzzingclient-memory:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control: the same client against the autobahn echo server.
          - name: published-echo-uncapped
            image: published
            server: echo
            limit: none
            client_gc: "no"
            server_gc: "yes"
          # The same client against aiohttp's own autobahn test server.
          - name: published-aiohttp-uncapped
            image: published
            server: aiohttp
            limit: none
            client_gc: "no"
            server_gc: "no"
          - name: published-aiohttp-cap-8g
            image: published
            server: aiohttp
            limit: 8g
            client_gc: "no"
            server_gc: "no"
          - name: published-aiohttp-uncapped-gc
            image: published
            server: aiohttp
            limit: none
            client_gc: "yes"
            server_gc: "no"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Pull published image
        if: matrix.image == 'published'
        run: docker pull "$IMAGE"

      - name: Install Just
        if: matrix.image != 'published'
        env:
          JUST_VERSION: 1.59.0
          JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        run: |
          tarball="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/${tarball}"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache local CPython 2.7 build
        if: matrix.image != 'published'
        id: cache-python2
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PY27_PREFIX }}
          key: cpy27-${{ runner.os }}
          restore-keys: |
            cpy27-${{ runner.os }}

      - name: Build CPython 2.7 from source
        if: matrix.image != 'published' && steps.cache-python2.outputs.cache-hit != 'true'
        run: just install-python2-deps

      - name: Add CPython 2.7 to PATH
        if: matrix.image != 'published'
        run: |
          echo "${{ env.PY27_PREFIX }}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${{ env.PY27_PREFIX }}/lib" >> $GITHUB_ENV

      - name: Build Docker image from this checkout
        if: matrix.image != 'published'
        run: just docker-build

      - name: Install aiohttp
        if: matrix.server == 'aiohttp'
        run: |
          python3 -m venv "$RUNNER_TEMP/aiohttp"
          "$RUNNER_TEMP/aiohttp/bin/pip" install --quiet 'aiohttp==3.14.5'
          "$RUNNER_TEMP/aiohttp/bin/python" -c "import sys, aiohttp; print(sys.version, aiohttp.__version__)"
          echo "AIOHTTP_PYTHON=$RUNNER_TEMP/aiohttp/bin/python" >> $GITHUB_ENV

      - name: Runner and image details
        run: |
          echo "kernel: $(uname -r)  cpus: $(nproc)"
          free -m
          swapon --show || true
          echo "cgroup fs: $(stat -fc %T /sys/fs/cgroup)"
          docker info --format 'docker cgroup: v{{.CgroupVersion}} driver={{.CgroupDriver}}'
          docker image inspect "$IMAGE" --format 'image: {{.Id}} created={{.Created}} digests={{.RepoDigests}}'
          docker run --rm --pull never "$IMAGE" python -c \
            "import sys; print(sys.version); print('jit: %s' % sys.pypy_translation_info['translation.jit'])"

      - name: Run fuzzingclient (${{ matrix.name }})
        env:
          SERVER: ${{ matrix.server || 'echo' }}
        run: |
          test/fuzzingclient_memory/measure.sh measure \
            "${{ matrix.limit }}" "${{ matrix.client_gc }}" "${{ matrix.server_gc }}"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzingclient-memory-${{ matrix.name }}
          path: |
            measure/summary.txt
            measure/samples.csv
            measure/client.log
            measure/server.log
          if-no-files-found: ignore
