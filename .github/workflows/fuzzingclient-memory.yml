name: fuzzingclient-memory

on:
  push:
    branches: [bot-ci-memory-experiments]
  workflow_dispatch:

env:
  PY27_PREFIX: /home/runner/.local/python2.7
  # Tag produced by `just docker-build` from this checkout (see justfile).
  IMAGE: crossbario/autobahn-testsuite:25.10.1

jobs:
  fuzzingclient-memory:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exactly what the PR runs, plus the client's measured peak.
          - name: cap-8g
            limit: 8g
            client_gc: "no"
            server_gc: "no"
          # The client's natural peak. The server collects every second so it
          # stays small and cannot exhaust the runner's RAM.
          - name: uncapped
            limit: none
            client_gc: "no"
            server_gc: "yes"
          # As above, with the client also collecting every second.
          - name: uncapped-gc
            limit: none
            client_gc: "yes"
            server_gc: "yes"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Just
        env:
          JUST_VERSION: 1.59.0
          JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        run: |
          tarball="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/${tarball}"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache local CPython 2.7 build
        id: cache-python2
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PY27_PREFIX }}
          key: cpy27-${{ runner.os }}
          restore-keys: |
            cpy27-${{ runner.os }}

      - name: Build CPython 2.7 from source
        if: steps.cache-python2.outputs.cache-hit != 'true'
        run: just install-python2-deps

      - name: Add CPython 2.7 to PATH
        run: |
          echo "${{ env.PY27_PREFIX }}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${{ env.PY27_PREFIX }}/lib" >> $GITHUB_ENV

      - name: Build Docker image from this checkout
        run: just docker-build

      - name: Runner and image details
        run: |
          echo "kernel: $(uname -r)  cpus: $(nproc)"
          free -m
          swapon --show || true
          echo "cgroup fs: $(stat -fc %T /sys/fs/cgroup)"
          docker info --format 'docker cgroup: v{{.CgroupVersion}} driver={{.CgroupDriver}}'
          docker run --rm --pull never "$IMAGE" python -c \
            "import sys; print(sys.version); print('jit: %s' % sys.pypy_translation_info['translation.jit'])"

      - name: Run fuzzingclient (${{ matrix.name }})
        run: |
          test/fuzzingclient_memory/measure.sh measure \
            "${{ matrix.limit }}" "${{ matrix.client_gc }}" "${{ matrix.server_gc }}"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzingclient-memory-${{ matrix.name }}
          path: |
            measure/summary.txt
            measure/samples.csv
            measure/client.log
          if-no-files-found: ignore
